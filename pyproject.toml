[project]
name = "openslides-test-tool"
version = "0.1.0"
description = "Performance tester for OpenSlides 4 polls (motions and elections)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openslides-test-tool = "os_perf.cli:main"
os-test = "os_perf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/os_perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
